name: daily-solve
on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST
  workflow_dispatch:
    inputs:
      force:
        description: "Rerun today even if already recorded"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-solve
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Solve today's problem
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          CSRFTOKEN: ${{ secrets.CSRFTOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: node scripts/run_daily.mjs

      - name: Commit state + dashboards
        run: |
          git config user.name "lc-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state index.html DASHBOARD.md
          git diff --cached --quiet && echo "nothing to commit" || (git commit -m "daily run $(date -u +%F)" && git push)
